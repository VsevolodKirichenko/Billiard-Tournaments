name: build-and-test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore BilliardTournaments.slnx
      - run: dotnet build BilliardTournaments.slnx -c Release --no-restore
      - run: dotnet test BilliardTournaments.slnx -c Release --no-build
      - run: docker build -t billiard-portfolio:ci .
