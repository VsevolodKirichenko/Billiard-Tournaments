name: billiard-portfolio
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: billiards
      POSTGRES_USER: billiards
      POSTGRES_PASSWORD: local-billiards-only
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billiards -d billiards"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:59092:59092"]
    volumes: ["kafka-data:/var/lib/kafka/data"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:59092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:59092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 25
  api:
    build: .
    ports: ["127.0.0.1:5080:8080"]
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=billiards;Username=billiards;Password=local-billiards-only
      ConnectionStrings__Redis: redis:6379,abortConnect=false,connectTimeout=2000,asyncTimeout=2000
      Kafka__BootstrapServers: kafka:9092
      Jwt__Key: ${JWT_KEY:?Run scripts/dev.ps1 to create .env}
      Bootstrap__AdminEmail: ${ADMIN_EMAIL:-admin@billiard.local}
      Bootstrap__AdminPassword: ${ADMIN_PASSWORD:?Run scripts/dev.ps1 to create .env}
      ApplyMigrations: 'true'
      InitializeIdentity: 'true'
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
volumes:
  postgres-data:
  kafka-data:
