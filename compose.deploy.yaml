# Remote deployment only. Configure .env on the target host; never copy local credentials.
services:
  api:
    image: ${IMAGE:?Select a published image}
    ports: ["127.0.0.1:${API_PORT:-5080}:8080"]
    environment:
      ConnectionStrings__Postgres: ${POSTGRES_CONNECTION:?Configure remote PostgreSQL}
      ConnectionStrings__Redis: ${REDIS_CONNECTION:?Configure remote Redis}
      Kafka__BootstrapServers: ${KAFKA_SERVERS:?Configure remote Kafka}
      Jwt__Key: ${JWT_KEY:?Configure remote signing key}
      AutoMapper__LicenseKey: ${AUTOMAPPER_LICENSE_KEY:-}
      ApplyMigrations: 'true'
      InitializeIdentity: ${INITIALIZE_IDENTITY:-false}
      Bootstrap__AdminEmail: ${ADMIN_EMAIL:-}
      Bootstrap__AdminPassword: ${ADMIN_PASSWORD:-}
